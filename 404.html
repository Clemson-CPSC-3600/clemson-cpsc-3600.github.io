<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - CPSC 3600: Computer Networks">
  <title>404 - Page Not Found | CPSC 3600</title>

  <!-- Shared styles -->
  <link rel="stylesheet" href="./shared/styles/main.css">

  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      background: var(--color-background);
    }

    .error-content {
      max-width: 600px;
      text-align: center;
    }

    .error-code {
      font-size: var(--font-size-6xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
      margin: 0 0 var(--space-4);
      line-height: 1;
    }

    .error-title {
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text);
      margin: 0 0 var(--space-4);
    }

    .error-description {
      font-size: var(--font-size-lg);
      color: var(--color-text-light);
      margin: 0 0 var(--space-8);
      line-height: var(--line-height-relaxed);
    }

    .error-links {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      align-items: center;
    }

    .error-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      background: var(--color-primary);
      color: white;
      text-decoration: none;
      border-radius: var(--radius-md);
      font-weight: var(--font-weight-medium);
      transition: background 0.2s;
    }

    .error-link:hover {
      background: var(--color-primary-dark);
    }

    .error-link.secondary {
      background: var(--color-background-alt);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .error-link.secondary:hover {
      background: var(--color-background);
    }

    @media (min-width: 640px) {
      .error-links {
        flex-direction: row;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-content">
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Page Not Found</h2>
      <p class="error-description">
        The page you're looking for doesn't exist or has been moved.
        Please check the URL or return to the course home page.
      </p>
      <div class="error-links">
        <a href="./index.html" class="error-link">
          <span aria-hidden="true">←</span>
          Back to Home
        </a>
        <a href="./modules/module1-big-picture/index.html" class="error-link secondary">
          View Module 1
        </a>
      </div>
    </div>
  </div>
</body>
</html>
